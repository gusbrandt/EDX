<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LifeLog</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🌿 LifeLog</h1>
  <nav id="tabs">
    <button data-view="today" class="active">Today</button>
    <button data-view="history">History</button>
    <button data-view="trends">Trends</button>
    <button data-view="settings">Settings</button>
  </nav>
</header>

<main>
  <section id="view-today" class="view">
    <div class="datebar">
      <button id="prev-day" aria-label="Previous day">‹</button>
      <input type="date" id="day">
      <button id="next-day" aria-label="Next day">›</button>
      <button id="go-today">Today</button>
    </div>
    <div id="totals" class="cards"></div>
    <form id="entry-form" class="panel">
      <h2 id="form-title">Add entry</h2>
      <div class="row">
        <label>Category <select id="f-cat"></select></label>
        <label>Date <input type="date" id="f-date" required></label>
        <label>Time <input type="time" id="f-time"></label>
      </div>
      <div class="row">
        <label class="grow">What <input id="f-title" placeholder="e.g. Leg day, Chicken salad, Calculus HW" required></label>
        <label><span>Amount <span class="unit" id="f-unit"></span></span> <input type="number" id="f-amount" min="0" step="any" placeholder="0"></label>
      </div>
      <label>Notes <textarea id="f-notes" rows="2" placeholder="Optional"></textarea></label>
      <div class="row">
        <button type="submit" class="primary" id="f-submit">Add</button>
        <button type="button" id="f-cancel" hidden>Cancel edit</button>
      </div>
    </form>
    <h2>Entries</h2>
    <ul id="day-list" class="entries"></ul>
  </section>

  <section id="view-history" class="view" hidden>
    <div class="row">
      <label>Category <select id="h-cat"></select></label>
      <label class="grow">Search <input id="h-q" placeholder="Search titles and notes"></label>
    </div>
    <div id="history"></div>
  </section>

  <section id="view-trends" class="view" hidden>
    <div id="trends"></div>
  </section>

  <section id="view-settings" class="view" hidden>
    <div class="panel">
      <h2>Categories</h2>
      <ul id="cat-list" class="entries"></ul>
      <form id="cat-form" class="row">
        <input id="c-emoji" maxlength="2" placeholder="🙂" style="width:3.5rem" required>
        <input id="c-name" class="grow" placeholder="New category (e.g. Reading)" required>
        <input id="c-unit" placeholder="unit (min)" style="width:6rem" required>
        <input id="c-goal" type="number" min="0" step="any" placeholder="daily goal" style="width:7rem">
        <button class="primary">Add</button>
      </form>
    </div>
    <div class="panel">
      <h2>Your data</h2>
      <p class="muted">Everything is stored in this browser only. Export a backup now and then.</p>
      <div class="row">
        <button id="export">Export JSON</button>
        <button id="export-csv">Export CSV</button>
        <label class="filebtn">Import JSON <input type="file" id="import" accept="application/json" hidden></label>
        <button id="wipe" class="danger">Delete everything</button>
      </div>
    </div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
